name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to EC2
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd ~/face-gallery-video-generator
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart face-gallery
          sudo systemctl status face-gallery --no-pager
        EOF
    
    - name: Verify deployment
      run: |
        curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/